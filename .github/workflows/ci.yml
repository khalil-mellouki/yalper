name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Format and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --all-features --locked

  bench:
    name: Hook latency (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Done criterion 7 of M1: the median of the full PostToolUse hook, process start included, must stay under
      # 50 ms. The median, not the p90, because shared CI machines (Windows above all) have slow outliers.
      - name: Hook latency gate (median under 50 ms)
        shell: bash
        env:
          YALPER_BENCH_CALLS: "100"
          YALPER_BENCH_MAX_MEDIAN_MS: "50"
        run: |
          status=0
          cargo bench --locked --bench hook_latency 2>&1 | tee bench.txt || status=$?
          grep -E '^hook_latency' bench.txt >> "$GITHUB_STEP_SUMMARY" || true
          exit "$status"
      - name: Shadow store and redaction benchmarks (report only)
        shell: bash
        run: |
          cargo bench --locked --bench shadow_store --bench redact | tee bench.txt
          grep -E '^(shadow_store|redact)' bench.txt >> "$GITHUB_STEP_SUMMARY"

  deny:
    name: Licenses and advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
