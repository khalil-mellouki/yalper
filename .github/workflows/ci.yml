name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Format and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The runners have Python, Node and cargo, but not uv.
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          enable-cache: false
      # Nor pnpm, for the test that `pnpm -r` in a bisect test copy never reaches the project's workspace.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413  # v6.1.0
        with:
          version: 10.34.6
      # Tests that need Python, Node, pnpm, uv or cargo skip when the tool is missing on a developer's machine,
      # and fail here instead.
      - run: cargo test --workspace --all-features --locked
        env:
          YALPER_REQUIRE_TOOLS: "1"

  end-to-end:
    name: Bisect end-to-end (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Done criterion 9 of M2: `yalper bisect` names the planted step of real Node, Python and Rust projects.
      # The runners have Node, npm, Python and cargo; npm and pip download from their registries. The samples are
      # ignored by a plain `cargo test` and run one at a time, so their run times are comparable.
      - name: Bisect sample projects
        shell: bash
        env:
          YALPER_REQUIRE_TOOLS: "1"
        run: |
          status=0
          cargo test --locked --test bisect_end_to_end -- --ignored --nocapture --test-threads 1 2>&1 | tee e2e.txt || status=$?
          grep -E '^bisect_end_to_end' e2e.txt >> "$GITHUB_STEP_SUMMARY" || true
          exit "$status"

  bench:
    name: Hook latency (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Done criterion 7 of M1: the median of the full PostToolUse hook, process start included, must stay under
      # 50 ms. The median, not the p90, because shared CI machines (Windows above all) have slow outliers.
      - name: Hook latency gate (median under 50 ms)
        shell: bash
        env:
          YALPER_BENCH_CALLS: "100"
          YALPER_BENCH_MAX_MEDIAN_MS: "50"
        run: |
          status=0
          cargo bench --locked --bench hook_latency 2>&1 | tee bench.txt || status=$?
          grep -E '^hook_latency' bench.txt >> "$GITHUB_STEP_SUMMARY" || true
          exit "$status"
      # Done criterion 3 of M2: switching a reused bisect test copy to the next step after a test run (undo the
      # run, diff, writes) must take under 1 s on a project of 1,000 files.
      - name: Test copy switch gate (median under 1 s)
        shell: bash
        env:
          YALPER_BENCH_MAX_MEDIAN_MS: "1000"
        run: |
          status=0
          cargo bench --locked --bench test_copy 2>&1 | tee bench.txt || status=$?
          grep -E '^test_copy' bench.txt >> "$GITHUB_STEP_SUMMARY" || true
          exit "$status"
      - name: Shadow store and redaction benchmarks (report only)
        shell: bash
        run: |
          cargo bench --locked --bench shadow_store --bench redact | tee bench.txt
          grep -E '^(shadow_store|redact)' bench.txt >> "$GITHUB_STEP_SUMMARY"

  deny:
    name: Licenses and advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
