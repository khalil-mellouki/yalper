[package]
name = "yalper"
description = "Record, replay, and debug AI coding agent sessions."
readme = "../../README.md"
keywords = ["ai-agents", "claude-code", "debugging", "bisect", "replay"]
categories = ["development-tools", "command-line-utilities"]
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true

[dependencies]
clap.workspace = true
serde_json.workspace = true

# Unix only: the current user id (to check who owns `.yalper`) and O_NOFOLLOW, without unsafe code.
[target.'cfg(unix)'.dependencies]
rustix = { version = "1", default-features = false, features = ["std", "fs", "process"] }

[dev-dependencies]
tempfile.workspace = true

[[bench]]
name = "hook_latency"
harness = false

[lints]
workspace = true
