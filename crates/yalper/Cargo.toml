[package]
name = "yalper"
description = "Record, replay, and debug AI coding agent sessions."
readme = "../../README.md"
keywords = ["ai-agents", "claude-code", "debugging", "bisect", "replay"]
categories = ["development-tools", "command-line-utilities"]
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true

[dependencies]
aho-corasick.workspace = true
clap.workspace = true
gix.workspace = true
ignore.workspace = true
regex-automata.workspace = true
rusqlite.workspace = true
serde_json.workspace = true

# Unix only: the current user id (to check who owns `.yalper`), O_NOFOLLOW and openat, without unsafe code.
[target.'cfg(unix)'.dependencies]
rustix = { version = "1", default-features = false, features = ["std", "fs", "process"] }

[features]
# Test entry point for the hook latency benchmark until M1-T06 records every step: with it, the environment
# variable `YALPER_BENCH_SNAPSHOT` makes `yalper hook` take a snapshot. Never enabled in released binaries.
bench-snapshot = []

[build-dependencies]
toml.workspace = true

[dev-dependencies]
tempfile.workspace = true

[[bench]]
name = "hook_latency"
harness = false
required-features = ["bench-snapshot"]

[[bench]]
name = "shadow_store"
harness = false

[[bench]]
name = "redact"
harness = false

[lints]
workspace = true
