[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/khalil-mellouki/yalper"
authors = ["Khalil Mellouki and the Yalper contributors"]
rust-version = "1.89"

[workspace.dependencies]
clap = { version = "4", features = ["derive"] }
serde_json = "1"
tempfile = "3"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Small, fast release binary: Yalper runs on every agent step, so startup time matters.
[profile.release]
lto = "thin"
codegen-units = 1
strip = true
